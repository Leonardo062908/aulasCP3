<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet" />
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}" defer></script>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div th:include="~{fragments/header :: cabecalho}"></div>

<div class="container mt-4">
    <h2 class="mb-3">Lista de Livros</h2>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="livro : ${listaLivros}">
            <td th:text="${livro.id}"></td>
            <td th:text="${livro.titulo}"></td>
            <td>
                <a th:href="@{'/livros/' + ${livro.id}}" class="btn btn-sm btn-primary">
                    Ver Detalhes
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:include="~{fragments/footer :: rodape}"></div>
</body>
</html>
